
name: Build PKHeX 3DS

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Diagnose and compile
        shell: bash
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"

          echo "=== ROOT ==="
          pwd
          ls -la

          echo "=== SOURCE FILES ==="
          find source -maxdepth 2 -type f -print

          echo "=== CHECK MAIN ==="
          grep -n "int main" source/main.c

          echo "=== MAKE DRY RUN ==="
          make -n clean
          make -n V=1

          echo "=== CLEAN ==="
          make clean

          echo "=== BUILD ==="
          make V=1 CC=arm-none-eabi-gcc LD=arm-none-eabi-gcc

          echo "=== OUTPUT ==="
          ls -lh PKHeX3DS.3dsx

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: PKHeX3DS
          path: PKHeX3DS.3dsx
