name: Build PKHeX 3DS

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Compile PKHeX
        shell: bash
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"

          if [ -f Makefile ]; then
            DIR="."
          elif [ -f PKHeX-3DS-Port-Starter/Makefile ]; then
            DIR="PKHeX-3DS-Port-Starter"
          else
            echo "No se encuentra el Makefile"
            exit 1
          fi

          export CC="$DEVKITARM/bin/arm-none-eabi-gcc"
          export LD="$DEVKITARM/bin/arm-none-eabi-gcc"
          make -C "$DIR" CC="$CC" LD="$LD"
          echo "ARTIFACT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: PKHeX3DS
          path: ${{ env.ARTIFACT_DIR }}/PKHeX3DS.3dsx
          
