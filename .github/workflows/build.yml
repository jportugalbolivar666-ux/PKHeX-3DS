wname: Build PKHeX 3DS

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install devkitPro
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget -U "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36" https://apt.devkitpro.org/install-devkitpro-pacman
          chmod +x install-devkitpro-pacman
          sudo ./install-devkitpro-pacman
          sudo dkp-pacman -S --noconfirm 3ds-dev

      - name: Compile
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"
          
          export CC="$DEVKITARM/bin/arm-none-eabi-gcc"
          export CXX="$DEVKITARM/bin/arm-none-eabi-g++"
          export AS="$DEVKITARM/bin/arm-none-eabi-as"
          export LD="$DEVKITARM/bin/arm-none-eabi-gcc"
          export AR="$DEVKITARM/bin/arm-none-eabi-ar"
          export OBJCOPY="$DEVKITARM/bin/arm-none-eabi-objcopy"
          make

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: PKHeX3DS
          path: PKHeX3DS.3dsx
